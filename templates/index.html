<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOTOLOTO PRO - BRASIL</title>
    <style>
        :root {
            --bg: #1a0033;
            --purple-3d: radial-gradient(circle at 15px 15px, #8a2be2, #4b0082);
            --gold-3d: radial-gradient(circle at 15px 15px, #ffd700, #b8860b);
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            padding: 10px; margin: 0; overflow-x: hidden;
        }

        header h1 { font-size: 2.5rem; letter-spacing: 12px; margin: 10px 0; font-weight: 900; text-shadow: 0 0 20px #8a2be2; }

        /* Smart N-3 Inputs */
        .n3-section { width: 100%; max-width: 450px; background: var(--glass); padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .n3-group { margin-bottom: 12px; }
        .n3-group label { display: block; font-size: 0.75rem; color: #aaa; margin-bottom: 5px; }
        .smart-input {
            width: 100%; background: #2b004d; border: 1px solid #8a2be2;
            color: #00ffcc; padding: 10px; border-radius: 8px;
            font-family: monospace; text-align: center; font-size: 0.9rem;
        }

        /* 10 Pipes System */
        .tubes-system {
            display: grid; grid-template-columns: repeat(10, 1fr);
            gap: 6px; width: 100%; max-width: 380px; margin-bottom: 20px;
        }
        .pipe {
            height: 70px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 0 0 12px 12px; position: relative;
        }
        .ball-in-pipe {
            width: 16px; height: 16px; border-radius: 50%;
            background: var(--purple-3d); position: absolute;
            bottom: 5px; left: 50%; transform: translateX(-50%);
            transition: bottom 2s cubic-bezier(0.47, 0, 0.745, 0.715);
        }

        /* Globe and Machine */
        .machine-stage { position: relative; text-align: center; }
        .globo-sphere {
            width: 270px; height: 270px; border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.25);
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05), transparent);
            position: relative; overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }
        .ball-kinetic {
            position: absolute; width: 22px; height: 22px;
            border-radius: 50%; background: var(--purple-3d);
            opacity: 0; transition: opacity 0.3s;
        }

        #btnValindo {
            background: #28a745; color: white; padding: 18px 60px;
            border: none; border-radius: 50px; font-size: 1.6rem;
            font-weight: 900; cursor: pointer; margin-top: 25px;
            box-shadow: 0 8px 25px rgba(40,167,69,0.4);
        }
        #btnValindo:disabled { background: #444; opacity: 0.6; cursor: not-allowed; }

        /* 3D Result Row */
        .results-matrix { width: 100%; max-width: 550px; margin-top: 35px; }
        .jogo-row {
            background: rgba(0,0,0,0.35); padding: 15px; border-radius: 12px;
            margin-bottom: 12px; border-left: 5px solid var(--gold-3d);
            display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        }
        .res-ball-3d {
            width: 34px; height: 34px; border-radius: 50%;
            background: var(--gold-3d); color: #1a0033;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 0.95rem;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.6);
            animation: eject-fx 0.5s ease-out;
        }
        @keyframes eject-fx { 0% { transform: scale(0) translateY(20px); } 100% { transform: scale(1) translateY(0); } }

        /* Animations */
        .fast-spin { animation: rotate-globe 0.25s linear infinite; }
        .slow-spin { animation: rotate-globe 1.8s linear infinite; }
        @keyframes rotate-globe { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header><h1>TOTOLOTO</h1></header>

    <!-- Smart N-3 Text Inputs -->
    <section class="n3-section">
        <div class="n3-group">
            <label>Concurso N (Cole os 15 números):</label>
            <input type="text" class="smart-input" id="nN" placeholder="Ex: 02 05 08 10...">
        </div>
        <div class="n3-group">
            <label>Concurso N-1:</label>
            <input type="text" class="smart-input" id="nN1">
        </div>
        <div class="n3-group">
            <label>Concurso N-2:</label>
            <input type="text" class="smart-input" id="nN2">
        </div>
    </section>

    <!-- 10 Pipes -->
    <div class="tubes-system" id="pipesArea"></div>

    <!-- Machine Stage -->
    <div class="machine-stage">
        <div class="globo-sphere" id="globoMain"></div>
        <button id="btnValindo">VALINDO</button>
    </div>

    <!-- Results Matrix -->
    <div class="results-matrix" id="matrix"></div>

    <script>
        // Setup 10 pipes and balls
        const pipesArea = document.getElementById('pipesArea');
        for(let i=0; i<10; i++) {
            pipesArea.innerHTML += `<div class="pipe"><div class="ball-in-pipe" id="pb-${i}"></div></div>`;
        }

        // Setup 25 kinetic balls in globe
        const globo = document.getElementById('globoMain');
        const kineticBalls = [];
        for(let i=0; i<25; i++) {
            const b = document.createElement('div');
            b.className = 'ball-kinetic';
            b.style.left = Math.random()*240 + 'px';
            b.style.top = Math.random()*240 + 'px';
            globo.appendChild(b);
            kineticBalls.push(b);
        }

        document.getElementById('btnValindo').onclick = async () => {
            const btn = document.getElementById('btnValindo');
            const matrix = document.getElementById('matrix');
            btn.disabled = true;

            // 1. DROP SEQUENCE (2 SECONDS)
            document.querySelectorAll('.ball-in-pipe').forEach(b => b.style.bottom = "-50px");
            setTimeout(() => {
                kineticBalls.forEach(b => b.style.opacity = "1");
            }, 1000);
            await new Promise(r => setTimeout(r, 2000));

            // Generate 15 UNIQUE numbers for this draw
            let drawResult = []; 
            while(drawResult.length < 15) {
                let n = Math.floor(Math.random()*25)+1;
                if(!drawResult.includes(n)) drawResult.push(n);
            }
            drawResult.sort((a,b) => a-b);

            const row = document.createElement('div');
            row.className = 'jogo-row';
            row.innerHTML = `<span style="width:100%; font-size:0.7rem; color:#666;">SORTEIO EM CURSO...</span>`;
            matrix.prepend(row);

            // 2. THE 15 BALL CYCLE (9s EACH)
            for(let i=0; i<15; i++) {
                // Fast Spin (4.5s)
                globo.className = "globo-sphere fast-spin";
                await new Promise(r => setTimeout(r, 4500));

                // Slow Spin (4.5s)
                globo.className = "globo-sphere slow-spin";
                await new Promise(r => setTimeout(r, 4500));

                // Eject 3D Ball
                const ball3d = document.createElement('div');
                ball3d.className = 'res-ball-3d';
                ball3d.innerText = drawResult[i].toString().padStart(2, '0');
                row.appendChild(ball3d);
                
                // Kinetic feedback
                kineticBalls[i].style.background = 'var(--gold-3d)';
            }

            globo.className = "globo-sphere";
            btn.disabled = false;
        };
    </script>
</body>
</html>
