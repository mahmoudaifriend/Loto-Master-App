<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOTOLOTO PRO - BRASIL</title>
    <style>
        :root {
            --bg: #1a0033;
            --purple-3d: radial-gradient(circle at 15px 15px, #8a2be2, #4b0082);
            --gold-3d: radial-gradient(circle at 15px 15px, #ffd700, #b8860b);
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            padding: 10px; margin: 0; overflow-x: hidden;
        }

        /* 1. 10 PIPES AT TOP */
        .tubes-system {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px; width: 100%; max-width: 400px;
            margin-bottom: 20px;
        }
        .pipe {
            height: 80px; background: var(--glass);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 0 0 10px 10px; position: relative;
        }
        .ball-in-pipe {
            width: 15px; height: 15px; border-radius: 50%;
            background: var(--purple-3d); position: absolute;
            bottom: 5px; left: 50%; transform: translateX(-50%);
        }

        /* 2. THE GLOBO */
        .globo-container { position: relative; margin: 30px 0; }
        .globo-sphere {
            width: 280px; height: 280px; border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.3);
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05), transparent);
            position: relative; overflow: hidden;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.9);
        }
        .ball-kinetic {
            position: absolute; width: 22px; height: 22px;
            border-radius: 50%; background: var(--purple-3d);
            transition: all 0.5s ease;
        }

        /* 3. CONTROLS */
        #btnValindo {
            background: #28a745; color: white; padding: 20px 70px;
            border: none; border-radius: 50px; font-size: 1.8rem;
            font-weight: 900; cursor: pointer; box-shadow: 0 10px 30px rgba(40,167,69,0.5);
        }
        #btnValindo:disabled { background: #444; cursor: not-allowed; }

        /* 4. RESULTS (3D BALLS) */
        .results-matrix { width: 100%; max-width: 600px; margin-top: 40px; }
        .jogo-row {
            background: rgba(0,0,0,0.4); padding: 15px;
            margin-bottom: 15px; border-radius: 12px;
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
            border-left: 6px solid var(--gold-3d);
        }
        .res-ball {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--gold-3d); color: #1a0033;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 0.9rem;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            animation: eject-anim 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes eject-anim { 0% { transform: scale(0) rotate(-180deg); } 100% { transform: scale(1) rotate(0); } }

        /* Animations */
        .spin-fast { animation: rotating 0.2s linear infinite; }
        .spin-slow { animation: rotating 1.5s linear infinite; }
        @keyframes rotating { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header><h1>TOTOLOTO</h1></header>

    <div class="tubes-system" id="pipes"></div>

    <div class="globo-container">
        <div class="globo-sphere" id="globo"></div>
        <div style="margin-top: 20px; text-align: center;">
            <button id="btnValindo">VALINDO</button>
        </div>
    </div>

    <div class="results-matrix" id="matrix"></div>

    <script>
        // 1. Initialize 10 Pipes with balls
        const pipesDiv = document.getElementById('pipes');
        for(let i=0; i<10; i++) {
            pipesDiv.innerHTML += `<div class="pipe"><div class="ball-in-pipe" id="p-ball-${i}"></div></div>`;
        }

        // 2. Initialize Globo with 25 kinetic balls
        const globo = document.getElementById('globo');
        const balls = [];
        for(let i=0; i<25; i++) {
            const b = document.createElement('div');
            b.className = 'ball-kinetic';
            // Start balls outside (simulating being high up)
            b.style.top = '-50px';
            b.style.left = Math.random()*250 + 'px';
            globo.appendChild(b);
            balls.push({ el: b, x: Math.random()*250, y: -50, vx: 0, vy: 0 });
        }

        // 3. THE MASTER SEQUENCE
        document.getElementById('btnValindo').onclick = async () => {
            const btn = document.getElementById('btnValindo');
            const matrix = document.getElementById('matrix');
            btn.disabled = true;

            // --- STEP 1: THE DROP (2 SECONDS) ---
            // Hide balls in pipes and drop balls in globo
            document.querySelectorAll('.ball-in-pipe').forEach(b => b.style.display = 'none');
            balls.forEach(b => {
                b.y = 150 + Math.random()*100;
                b.vx = (Math.random()-0.5)*20;
                b.vy = (Math.random()-0.5)*20;
                b.el.style.top = b.y + 'px';
            });
            await new Promise(r => setTimeout(r, 2000));

            // Create a new result row
            const row = document.createElement('div');
            row.className = 'jogo-row';
            row.innerHTML = `<span style="width:100%; font-weight:bold; color:#888; margin-bottom:10px;">SORTEIO EM CURSO...</span>`;
            matrix.prepend(row);

            // --- STEP 2: THE 15 BALL REPETITION ---
            // Timing: 4.5s Fast + 4.5s Slow = 9s per ball
            for(let i=1; i<=15; i++) {
                // A. FAST MIXING (4.5s)
                globo.className = 'globo-sphere spin-fast';
                await new Promise(r => setTimeout(r, 4500));

                // B. SLOW DOWN (4.5s)
                globo.className = 'globo-sphere spin-slow';
                await new Promise(r => setTimeout(r, 4500));

                // C. EJECT BALL (3D Sphere)
                const num = Math.floor(Math.random()*25)+1; // In real use, fetch from Python API
                const resBall = document.createElement('div');
                resBall.className = 'res-ball';
                resBall.innerText = num.toString().padStart(2, '0');
                row.appendChild(resBall);
                
                // Visual feedback in globo
                const kinetic = balls[i % 25];
                kinetic.el.style.background = 'var(--gold-3d)';
                setTimeout(() => kinetic.el.style.background = 'var(--purple-3d)', 1000);
            }

            globo.className = 'globo-sphere'; // Stop
            btn.disabled = false;
        };
    </script>
</body>
</html>
